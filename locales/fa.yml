about:
  content-fork: |
    # درباره کارگاه برنامه ‎1Panel‎

    این نسخهای تخصصی از IT-Tools است که برای فراهم کردن پشتیبانی یکپارچه ساخت برنامههای محلی ویژه فروشگاه برنامه ‎1Panel‎ طراحی شده است.

    بهراحتی برنامههای محلی ‎1Panel‎ مخصوص خود را بسازید.

